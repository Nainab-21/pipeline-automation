apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: rs-pipeline
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          # Service account needs: Secret Manager access (for AWS creds)
          serviceAccountName: rs-pipeline-sa@YOUR_PROJECT_ID.iam.gserviceaccount.com

          timeoutSeconds: 14400   # 4 hours max
          maxRetries: 0           # Don't auto-retry — S3 sync makes reruns idempotent

          containers:
            - image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT_ID/rs-pipeline/rs-pipeline:latest
              name: rs-pipeline

              resources:
                limits:
                  cpu: "4"
                  memory: "16Gi"

              env:
                # ── Mill config (overridden at runtime via --update-env-vars) ──
                - name: MILL
                  value: "EMSA"
                - name: FECHA_INICIO
                  value: "2026-03-24"
                - name: FECHA_FIN
                  value: "2026-03-27"
                - name: FECHAS
                  value: "2026-03-26"

                # ── S3 workspace ──────────────────────────────────────────────
                - name: S3_BUCKET
                  value: "carrier-pdfs"
                - name: S3_PREFIX
                  value: "rs-pipeline-sync"

                # ── AWS credentials (from GCP Secret Manager) ─────────────────
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-access-key-id
                      key: latest
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-secret-access-key
                      key: latest
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
